name: ag2   # pinned so volumes survive a directory rename

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ag2
      POSTGRES_USER: ag2
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Not published to the host — only the app container talks to it.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ag2 -d ag2 -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${AG2_IMAGE:-prezmcmahon/ag2:latest}
    build: .
    restart: unless-stopped
    # A normal bridge network is enough: the app only makes outbound HTTP
    # requests to your monitors' LAN IPs (no UDP broadcast, unlike WeathAir).
    ports:
      - "${AG2_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://ag2:${DB_PASSWORD}@db:5432/ag2
      - DATA_DIR=/app/data
      - AG2_API_KEY=${AG2_API_KEY:-}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  # ── Optional: public HTTPS via Cloudflare Tunnel ───────────────────────────
  # Uncomment, set CLOUDFLARE_TUNNEL_TOKEN, and point the tunnel at http://app:3000.
  # If you expose AG2 publicly, put Cloudflare Access (or similar) in front of it.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     - app

volumes:
  db_data:
